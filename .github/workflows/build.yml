name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [created]

# ──────────────────────────────────────────────
# Permissions (least-privilege for GITHUB_TOKEN)
# ──────────────────────────────────────────────
permissions:
  contents: write        # attach assets to releases
  packages: write        # push to ghcr.io

jobs:
  # ════════════════════════════════════════════
  # Job 1 – Build cross-platform executables
  # ════════════════════════════════════════════
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: phos-watch-linux
            asset_name: phos-watch-linux
          - os: windows-latest
            artifact_name: phos-watch.exe
            asset_name: phos-watch-windows.exe
          - os: macos-latest
            artifact_name: phos-watch-mac
            asset_name: phos-watch-mac

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Build Script
      run: python build.py

    - name: Rename build artifact (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mv dist/phos-watch dist/${{ matrix.asset_name }}

    - name: Rename build artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Rename-Item -Path dist\phos-watch.exe -NewName ${{ matrix.asset_name }}
      shell: pwsh

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  # ════════════════════════════════════════════
  # Job 2 – Build (and push) multi-arch Docker image
  # ════════════════════════════════════════════
  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          # branch pushes → branch name tag
          type=ref,event=branch
          # pull requests → pr-<number>
          type=ref,event=pr
          # releases → semver tags (e.g. 1.2.3, 1.2, 1)
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # latest on default branch push or release
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ════════════════════════════════════════════
  # Job 3 – Attach executables to GitHub Release
  # ════════════════════════════════════════════
  release:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: [build, docker]
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: phos-watch-*
        path: artifacts

    - name: Upload assets to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/phos-watch-linux/phos-watch-linux
          artifacts/phos-watch-windows.exe/phos-watch-windows.exe
          artifacts/phos-watch-mac/phos-watch-mac
