name: Build and Release Executables

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: phos-watch-linux
            asset_name: phos-watch-linux
          - os: windows-latest
            artifact_name: phos-watch.exe
            asset_name: phos-watch-windows.exe
          - os: macos-latest
            artifact_name: phos-watch-mac
            asset_name: phos-watch-mac

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Build Script
      run: python build.py

    - name: Rename build artifact (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mv dist/phos-watch dist/${{ matrix.asset_name }}

    - name: Rename build artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Rename-Item -Path dist\phos-watch.exe -NewName ${{ matrix.asset_name }}
      shell: pwsh

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}
